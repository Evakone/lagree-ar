<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lagree AR V2 - Plane Detection</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module" src="https://unpkg.com/@google/model-viewer@^3.0.0/dist/model-viewer.min.js"></script>
    <style>
        model-viewer {
            width: 100vw;
            height: 100vh;
            background: #000;
        }
    </style>
</head>

<body>
    <div id="app">
        <model-viewer src="/assets/models/LCSE-AR-Back-Wall-Clean-Parented-pipeline.glb"
            ios-src="/assets/models/LCSE-AR-Back-Wall-Clean-Parented.usdz" ar ar-modes="webxr scene-viewer quick-look"
            camera-controls environment-image="neutral" shadow-intensity="1" autoplay>

            <div slot="ar-button" class="ar-cta">
                <button>View in AR</button>
            </div>
        </model-viewer>

        <div class="hud">
            <a href="/index.html"
                style="color: white; text-decoration: none; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px;">
                ⟵ Back
            </a>
        </div>
    </div>
</body>

</html>
